<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFF3F1"/>
      <stop offset="60%" stop-color="#FEDDD7"/>
      <stop offset="100%" stop-color="#F9CBC3"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="1024" fill="url(#bgGrad)"/>

  <!-- Decorative Bubbles matching the PDF screenshot -->
  <g opacity="0.35">
    <!-- Top Left clusters -->
    <circle cx="160" cy="220" r="105" fill="#FA8072" filter="url(#softBlur)"/>
    <circle cx="80" cy="380" r="70" fill="#FF8A80" filter="url(#softBlur)"/>
    <circle cx="260" cy="310" r="45" fill="#FF8A80"/>

    <!-- Bottom Left clusters -->
    <circle cx="180" cy="720" r="120" fill="#FFAB91" filter="url(#softBlur)"/>
    <circle cx="90" cy="860" r="85" fill="#FF8A80"/>
    <circle cx="280" cy="850" r="50" fill="#FFAB91"/>
    
    <!-- Top Right clusters -->
    <circle cx="1320" cy="180" r="110" fill="#FF8A80" filter="url(#softBlur)"/>
    <circle cx="1200" cy="280" r="85" fill="#FFAB91"/>
    <circle cx="1370" cy="360" r="55" fill="#FA8072"/>

    <!-- Bottom Right clusters -->
    <circle cx="1280" cy="680" r="130" fill="#FF8A80" filter="url(#softBlur)"/>
    <circle cx="1180" cy="820" r="80" fill="#FFAB91"/>
    <circle cx="1380" cy="860" r="95" fill="#FA8072"/>
    <circle cx="1100" cy="940" r="45" fill="#FF8A80"/>

    <!-- Subtle Center/Ambient bubbles -->
    <circle cx="480" cy="140" r="60" fill="#FFD1C9" opacity="0.4"/>
    <circle cx="960" cy="130" r="50" fill="#FFD1C9" opacity="0.4"/>
    <circle cx="720" cy="950" r="90" fill="#FFAAA6" opacity="0.3" filter="url(#softBlur)"/>
    <circle cx="580" cy="780" r="40" fill="#FFAB91" opacity="0.25"/>
    <circle cx="860" cy="790" r="45" fill="#FFAB91" opacity="0.25"/>
  </g>
</svg>
